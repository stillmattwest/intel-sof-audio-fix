# Force SOF driver for Intel Broadwell/Haswell audio DSPs.
# These platforms have competing drivers (SOF vs catpt) and the kernel's
# auto-detection often selects catpt, which fails on many laptops.
# Affects ACPI devices INT3438 (Broadwell) and INT33C8 (Haswell).
options snd_intel_dspcfg dsp_driver=3
blacklist snd_soc_catpt
